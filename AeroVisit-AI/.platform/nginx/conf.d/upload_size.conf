# Elastic Beanstalk nginx: Spring Boot sends the KYC selfie + ID close-up as Base64 JSON to /kyc/verify, often
# several MB. nginx allows only 1 MB by default (413), which made every KYC check fall back to manual review and
# left no face vector for biometric bans. Matches the Spring Boot side (50M).
client_max_body_size 50M;
