# Elastic Beanstalk nginx: allow phone-camera ID photos and selfies through to Spring Boot.
# nginx allows only 1 MB by default (413 Request Entity Too Large); Spring Boot checks the real limit
# (15 MB per file, application.properties) and shows its own "photo too large" message, so this matches
# server.tomcat.max-swallow-size (50 MB) to let that message arrive.
client_max_body_size 50M;
