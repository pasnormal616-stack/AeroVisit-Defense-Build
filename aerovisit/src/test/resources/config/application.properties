# Tests: the rate limiter is off, so the existing suites (every MockMvc request comes from 127.0.0.1) never share a
# bucket. This file is loaded on top of the main application.properties, not instead of it.
# RateLimitFilterTest switches it back on with @TestPropertySource.
aerovisit.ratelimit.enabled=false
# Tests never log in to Gmail: without a password EmailService refuses to send before opening any connection,
# even when the developer's .env holds the real App Password.
spring.mail.password=
# Tests never create staff accounts in the real database (AerovisitApplicationTests boots the full app against it)
aerovisit.staff.seed-enabled=false
