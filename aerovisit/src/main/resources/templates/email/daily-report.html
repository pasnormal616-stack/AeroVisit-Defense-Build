<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Daily Visitor Summary</title></head>
<!--/* Internal (sent to the Director). Variables: date, expected, checkedIn, noShows, internal = true */-->
<body th:replace="~{email/layout :: layout('Daily Visitor Summary', ~{::content})}">
<div th:fragment="content">
  <p style="margin:0 0 14px;">Good evening, Director.</p>
  <p style="margin:0 0 16px;">Please find below the daily attendance summary for <strong th:text="${date}" style="white-space:nowrap;">2026-10-20</strong>.</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 18px; border-collapse:collapse;">
    <tr>
      <td style="padding:10px 14px; border:1px solid #d1d5db; font-family:Arial, Helvetica, sans-serif; font-size:14px; color:#374151;">Total expected visitors</td>
      <td th:text="${expected}" style="padding:10px 14px; border:1px solid #d1d5db; font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:bold; color:#111827; text-align:right;">40</td>
    </tr>
    <tr>
      <td style="padding:10px 14px; border:1px solid #d1d5db; font-family:Arial, Helvetica, sans-serif; font-size:14px; color:#374151;">Total checked in</td>
      <td th:text="${checkedIn}" style="padding:10px 14px; border:1px solid #d1d5db; font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:bold; color:#111827; text-align:right;">35</td>
    </tr>
    <tr>
      <td style="padding:10px 14px; border:1px solid #d1d5db; font-family:Arial, Helvetica, sans-serif; font-size:14px; color:#374151;">Total no-shows, pending or rejected</td>
      <td th:text="${noShows}" style="padding:10px 14px; border:1px solid #d1d5db; font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:bold; color:#111827; text-align:right;">5</td>
    </tr>
  </table>
  <p style="margin:0;">Full details are available on the Admin Dashboard.</p>
</div>
</body>
</html>
