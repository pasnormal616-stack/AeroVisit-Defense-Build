<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thank You for Your Visit</title></head>
<!--/* Variables: name, feedbackLink (built from the visitor's secure token) */-->
<body th:replace="~{email/layout :: layout('Thank You for Your Visit', ~{::content})}">
<div th:fragment="content">
  <p style="margin:0 0 14px;">Dear <span th:text="${name}">Juan Dela Cruz</span>,</p>
  <p style="margin:0 0 14px;">Thank you for visiting the Philippine Air Force Aerospace Museum. Your departure has been recorded.</p>
  <p style="margin:0 0 20px;">The Office of the Director would appreciate your feedback on your visit. Your comments help us improve the experience for all future visitors.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 4px;">
    <tr>
      <td style="background-color:#002B80;">
        <a th:href="${feedbackLink}" href="#" style="display:inline-block; padding:12px 24px; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:bold; color:#ffffff; text-decoration:none;">Submit Feedback</a>
      </td>
    </tr>
  </table>
</div>
</body>
</html>
