<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Critical Visitor Feedback</title></head>
<!--/* Internal (sent to the Director). Variables: visitorName, feedbackText, sentimentScore, internal = true */-->
<body th:replace="~{email/layout :: layout('Critical Visitor Feedback', ~{::content})}">
<div th:fragment="content">
  <p style="margin:0 0 14px;">Director,</p>
  <p style="margin:0 0 16px;">The sentiment analysis system has flagged the following visitor feedback as strongly negative. Your attention is respectfully requested.</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px; border:1px solid #d1d5db; border-left:4px solid #C41F1E; background-color:#f9fafb;">
    <tr>
      <td style="padding:14px 16px; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.6; font-style:italic; color:#1f2937;">
        "<span th:text="${feedbackText}">The exhibit was closed.</span>"
      </td>
    </tr>
  </table>
  <p style="margin:0 0 6px;"><strong>Visitor:</strong> <span th:text="${visitorName}">Juan Dela Cruz</span></p>
  <p style="margin:0;"><strong>Severity score:</strong> <span th:text="${sentimentScore}">0.93</span> (negative)</p>
</div>
</body>
</html>
