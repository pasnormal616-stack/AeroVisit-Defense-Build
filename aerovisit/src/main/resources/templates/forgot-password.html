<!DOCTYPE html>
<html lang="en" class="no-js" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"></th:block>
    <title>AeroVisit - Forgot Password</title>
</head>
<body class="av-app">

<!-- 🔑 Forgot Password (ForgotPasswordController): step 1 asks for a code, step 2 sets the new password with it.
     Same sign-in layout as login.html; the fetch calls carry the CSRF token from the <meta> tags (AeroCsrf). -->
<main class="av-auth">
    <div class="av-auth-top">
        <span class="paf-logo-plate av-auth-logo"><img class="paf-logo" src="/images/paflogo.png" alt="Philippine Air Force Museum Logo" width="260" height="130"></span>
    </div>

    <!-- Mobile first: the full width on phones, a centred narrow column from tablets up -->
    <div class="col-12 col-md-8 col-lg-6 col-xl-5 mx-auto p-3">
    <section class="av-auth-panel mx-auto">
        <button type="button" class="av-iconbtn theme-toggle av-theme-corner" data-theme-toggle aria-label="Toggle dark mode">
            <i class="bi bi-moon-stars theme-icon-light"></i>
            <i class="bi bi-sun theme-icon-dark"></i>
        </button>

        <h2>Forgot Password</h2>
        <p class="av-auth-sub" id="resetIntro">Enter the Director account's email address. A reset code will be sent to it.</p>

        <div id="resetMessage" class="alert d-none" role="status" aria-live="polite"></div>

        <!-- STEP 1: request a code -->
        <form id="requestForm" autocomplete="off">
            <div class="av-field mb-3">
                <label class="form-label-custom" for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" name="email" class="form-control-custom" placeholder="Director email address" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3"><i class="bi bi-envelope-check me-1"></i>Send Reset Code</button>
        </form>

        <!-- STEP 2: code + new password (shown after step 1) -->
        <form id="resetForm" class="d-none" autocomplete="off">
            <input type="hidden" id="resetFormEmail" name="email">
            <div class="av-field mb-3">
                <label class="form-label-custom" for="resetCode">6-Digit Reset Code</label>
                <input type="text" id="resetCode" name="code" class="form-control-custom av-mono" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
            </div>
            <div class="av-field mb-3">
                <label class="form-label-custom" for="resetNewPassword">New Password</label>
                <input type="password" id="resetNewPassword" name="newPassword" class="form-control-custom" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <div class="av-field mb-3">
                <label class="form-label-custom" for="resetConfirmPassword">Confirm New Password</label>
                <input type="password" id="resetConfirmPassword" name="confirmPassword" class="form-control-custom" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3"><i class="bi bi-check2-circle me-1"></i>Reset Password</button>
            <div class="text-center mt-3"><a href="#" id="startOver" class="small">Use a different email or request a new code</a></div>
        </form>

        <!-- DONE -->
        <a href="/login" id="backToLogin" class="btn btn-primary w-100 mt-3 d-none"><i class="bi bi-box-arrow-in-right me-1"></i>Back to Log in</a>
    </section>
    </div>

    <p class="av-auth-foot">Authorised personnel only. All sessions are logged. &middot; <a href="/login">Back to Log in</a></p>
</main>

<script>
(function () {
    var message = document.getElementById('resetMessage');
    var intro = document.getElementById('resetIntro');
    var requestForm = document.getElementById('requestForm');
    var resetForm = document.getElementById('resetForm');

    function show(text, ok) {
        message.textContent = text;
        message.className = 'alert ' + (ok ? 'alert-success' : 'alert-danger');
    }

    // Shows a spinner on a submit button while its request runs; returns a function that puts the original label back
    function busy(button, label) {
        var original = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>' + label;
        return function () { button.innerHTML = original; };
    }

    function post(url, form) {
        return fetch(url, {
            method: 'POST',
            headers: AeroCsrf.headers({'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded'}),
            body: new URLSearchParams(form).toString()
        }).then(function (response) {
            return response.json().catch(function () { return {ok: false, message: 'Unexpected answer from the server.'}; });
        }).catch(function () {
            return {ok: false, message: 'The server could not be reached. Please try again.'};
        });
    }

    // Step 1 -> the same answer for every address; step 2 opens either way
    requestForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var button = requestForm.querySelector('button[type="submit"]');
        var restore = busy(button, 'Sending...');
        post('/forgot-password/request', new FormData(requestForm)).then(function (data) {
            restore();
            button.disabled = false;
            show(data.message || 'Something went wrong.', data.ok);
            if (data.ok) {
                document.getElementById('resetFormEmail').value = document.getElementById('resetEmail').value.trim();
                intro.textContent = 'Enter the code from the email and choose a new password.';
                requestForm.classList.add('d-none');
                resetForm.classList.remove('d-none');
                document.getElementById('resetCode').focus();
            }
        });
    });

    // Step 2 -> the new password is saved only with the right code
    resetForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var button = resetForm.querySelector('button[type="submit"]');
        var restore = busy(button, 'Verifying...');
        post('/forgot-password/reset', new FormData(resetForm)).then(function (data) {
            restore();
            button.disabled = false;
            show(data.message || 'Something went wrong.', data.ok);
            if (data.ok) {
                resetForm.reset();
                resetForm.classList.add('d-none');
                intro.textContent = 'Your password has been changed.';
                document.getElementById('backToLogin').classList.remove('d-none');
            }
        });
    });

    document.getElementById('startOver').addEventListener('click', function (event) {
        event.preventDefault();
        resetForm.reset();
        resetForm.classList.add('d-none');
        requestForm.classList.remove('d-none');
        message.className = 'alert d-none';
        intro.textContent = "Enter the Director account's email address. A reset code will be sent to it.";
        document.getElementById('resetEmail').focus();
    });
})();
</script>

</body>
</html>
