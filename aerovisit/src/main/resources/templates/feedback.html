<!DOCTYPE html>
<html lang="en" class="no-js" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/visitor :: head}"></th:block>
    <title>AeroVisit - After-Action Report</title>
</head>
<body class="vp vp--immersive">

<th:block th:replace="~{fragments/visitor :: backdrop}"></th:block>

<th:block th:replace="~{fragments/visitor :: topnav(false)}"></th:block>

<div class="vp-page">
    <div class="vp-page-band" aria-hidden="true"></div>
    <main class="vp-page-main">
        <div class="container">
            <div class="vp-narrow">
                <div class="vp-bezel vp-reveal">
                    <div class="vp-bezel-core vp-card-pad">
                        <div class="vp-status-ico vp-status-ico--gold"><i class="bi bi-star"></i></div>
                        <h1 class="vp-title-xl">After-Action Report</h1>
                        <p class="vp-lead">Welcome back, <strong class="text-dark" th:text="${visitor.name}"></strong>! Your departure has been logged. The Museum Director requests your evaluation of the facility.</p>

                        <form th:action="@{/submit-feedback}" method="post">
                            <input type="hidden" name="token" th:value="${visitor.secureToken}">
                            <fieldset class="vp-field text-center">
                                <legend class="form-label">Overall Rating</legend>
                                <div class="rating mt-2">
                                    <input type="radio" name="rating" id="star5" value="5" required><label for="star5" aria-label="5 stars">★</label>
                                    <input type="radio" name="rating" id="star4" value="4"><label for="star4" aria-label="4 stars">★</label>
                                    <input type="radio" name="rating" id="star3" value="3"><label for="star3" aria-label="3 stars">★</label>
                                    <input type="radio" name="rating" id="star2" value="2"><label for="star2" aria-label="2 stars">★</label>
                                    <input type="radio" name="rating" id="star1" value="1"><label for="star1" aria-label="1 star">★</label>
                                </div>
                            </fieldset>
                            <div class="vp-field">
                                <label class="form-label" for="feedbackZone">Which area are you reviewing?</label>
                                <!-- Filled from GET /api/zones (active zones only); "required" is added once the list has loaded -->
                                <select id="feedbackZone" name="zone" class="form-select">
                                    <option value="">Loading museum areas…</option>
                                </select>
                            </div>
                            <div class="vp-field">
                                <label class="form-label" for="feedbackText">Additional Comments (Optional)</label>
                                <textarea id="feedbackText" name="feedback" class="form-control" rows="4" placeholder="How was the cleanliness, staff professionalism, and exhibit quality?"></textarea>
                            </div>
                            <button type="submit" class="vp-btn vp-btn--gold vp-btn--block">Transmit Report <span class="vp-btn-icon"><i class="bi bi-send"></i></span></button>
                        </form>

                        <p class="vp-foot-note">PAF Aerospace Museum &middot; Visitor Experience Command</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/visitor :: scripts}"></th:block>
<script>
    // Root Cause Matrix: list the museum areas the Director has left active. If the list can't load,
    // the dropdown stays optional so the visitor can still send the report.
    document.addEventListener('DOMContentLoaded', function () {
        var select = document.getElementById('feedbackZone');
        fetch('/api/zones', { headers: { 'Accept': 'application/json' } })
            .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
            .then(function (zones) {
                select.innerHTML = '';
                var placeholder = new Option('Select an area…', '');
                placeholder.disabled = true;
                placeholder.selected = true;
                select.add(placeholder);
                zones.forEach(function (zone) { select.add(new Option(zone.name, zone.name)); });
                if (zones.length) select.required = true;
            })
            .catch(function () {
                select.innerHTML = '';
                select.add(new Option('General Experience', ''));
            });
    });
</script>
</body>
</html>
