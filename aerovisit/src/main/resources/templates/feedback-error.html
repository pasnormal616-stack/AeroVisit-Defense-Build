<!DOCTYPE html>
<html lang="en" class="no-js" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/visitor :: head}"></th:block>
    <title>AeroVisit - Notice</title>
</head>
<body class="vp vp--immersive">

<th:block th:replace="~{fragments/visitor :: backdrop}"></th:block>

<th:block th:replace="~{fragments/visitor :: topnav(false)}"></th:block>

<div class="vp-page">
    <div class="vp-page-band" aria-hidden="true"></div>
    <main class="vp-page-main">
        <div class="container">
            <div class="vp-narrow">
                <div class="vp-bezel vp-reveal">
                    <div class="vp-bezel-core vp-card-pad text-center">
                        <div class="vp-status-ico vp-status-ico--warn"><i class="bi bi-exclamation-triangle"></i></div>
                        <h1 class="vp-title-xl">System Notice</h1>
                        <p class="vp-lead fw-semibold" th:text="${error}"></p>
                        <p class="vp-foot-note">If you believe you are seeing this in error, please contact the museum administration desk.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/visitor :: scripts}"></th:block>
</body>
</html>
