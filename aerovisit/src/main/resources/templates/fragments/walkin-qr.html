<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 🚶 THE WALK-IN GATE PASS: the booking's secure token as a QR. A gate scan opens the walk-in's Process panel (it never
       admits anyone by itself). Shown only while the pass can still be used (Visitor.walkInPassUsable: a walk-in for
       today, booked, not yet inside). Used by payment.html, success.html and manage-booking.html (mode 'page', src = a
       data: URI) and by email/payment-requested.html and email/walkin-pass.html (mode 'email', src = 'cid:entryQr':
       mail apps block data: images, so EmailService embeds the PNG). referenceId may be null. */-->
<div th:fragment="pass(src, referenceId, mode)"
     th:class="${mode == 'page'} ? 'vp-gate-pass' : null"
     th:style="${mode == 'email'} ? 'margin:0 0 18px; padding:16px; border:1px solid #d1d5db; border-left:4px solid #002B80; background-color:#ffffff; text-align:center; font-family:Arial, Helvetica, sans-serif;' : null">
  <p th:class="${mode == 'page'} ? 'vp-gate-pass-label' : null"
     th:style="${mode == 'email'} ? 'margin:0 0 10px; font-size:16px; font-weight:bold; color:#111827;' : null">Show this QR to the guard at the gate</p>
  <img th:src="${src}" alt="Your walk-in gate QR code" width="240" height="240"
       th:class="${mode == 'page'} ? 'vp-gate-pass-qr' : null"
       th:style="${mode == 'email'} ? 'display:block; margin:0 auto; width:240px; height:240px; border:1px solid #d1d5db;' : null">
  <p th:if="${referenceId != null}" th:class="${mode == 'page'} ? 'vp-gate-pass-ref' : null"
     th:style="${mode == 'email'} ? 'margin:10px 0 0; font-size:13px; color:#374151;' : null">Reference ID <strong th:text="${referenceId}">PAF-A7X92K</strong> &middot; bring a valid ID</p>
</div>
</body>
</html>
