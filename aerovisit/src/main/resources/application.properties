spring.application.name=aerovisit
server.port=8081

# ============================================================================
# 🔒 SECRETS ARE READ FROM ENVIRONMENT VARIABLES — never type real values here.
# Format: ${ENV_VAR_NAME:fallback}. See .env.example for the full list.
# Values can also go in a local ".env" file in the project folder (git-ignored).
# Real environment variables take priority over the .env file.
# ============================================================================
spring.config.import=optional:file:.env[.properties]

# --- 0. Session cookie hardening ---
# Blocks other websites from riding on an admin's login (e.g. a link to /admin/approve/5)
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# --- 0b. Behind ngrok (HTTPS ends at ngrok; the app itself receives plain HTTP from the ngrok agent on 127.0.0.1) ---
# Trust X-Forwarded-Proto / X-Forwarded-For from that local proxy, so redirects stay on https:// (the SameSite=Strict
# session cookie is dropped on an https -> http redirect) and the visitor's real IP is used. "native" (Tomcat
# RemoteIpValve) only trusts proxies on this machine or the private network; a visitor can't fake their IP with it.
# Plain http://localhost use is unchanged (no forwarded headers, nothing to apply).
server.forward-headers-strategy=native

# --- 1. Database Connection (Native MySQL) ---
# 🔥 Updated for Railway Cloud Database
spring.datasource.url=jdbc:mysql://${MYSQLHOST:sakura.proxy.rlwy.net}:${MYSQLPORT:17064}/${MYSQLDATABASE:railway}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:eHSQsUBcFRwOkwlyZbfgeQAcjpTKsTFH}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- 1b. Connection pool (HikariCP, Spring Boot's default) ---
# Kept small on purpose (HikariCP's sizing advice: a few connections serve many requests when each one is held briefly).
# A request waiting longer than 10 s for a free connection fails fast instead of piling up for the 30 s default, and a
# connection held for over 30 s is logged as a probable leak.
spring.datasource.hikari.pool-name=AeroVisitPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=30000
# Open Session in View OFF: a request gives its DB connection back as soon as each query/transaction ends, instead of
# holding it until the page is rendered (through the KYC call to Python and the SMTP send). Safe here because no entity
# has a lazy relationship and every change is saved explicitly. Proven by ConnectionPoolScalabilityTest.
spring.jpa.open-in-view=false

# --- 3. Email Settings ---
# Gmail SMTP (STARTTLS, 587). AEROVISIT_MAIL_PASSWORD must be a Gmail App Password (Google Account > Security >
# 2-Step Verification > App passwords), not the account password. Set it in .env, never commit it.
# (Gmail SMTP works for the local + ngrok setup; hosts that block outgoing SMTP, such as Railway, would need an HTTP API.)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=PAFMuseumOfficial@gmail.com
spring.mail.password=${AEROVISIT_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# ⏱️ SMTP gives up after 10 s (connect, read, write; JavaMail's defaults wait forever), so email can never hang a request
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# "From" of every email: always the account above (Gmail rewrites or rejects a different sender)
aerovisit.mail.from=${spring.mail.username}

# --- 4. External APIs (Weather) ---
# The Gemini chatbot key is NOT set here: only the Python AI service calls Gemini (GEMINI_API_KEY in AeroVisit-AI/.env).
openweathermap.api.key=${OPENWEATHER_API_KEY:${OWM_API_KEY:}}
openweathermap.api.url=https://api.openweathermap.org/data/2.5/weather

# --- 4b. Staff Login Passwords ---
# Two accounts: "director" (role DIRECTOR) and "guard" (role GUARD).
# If unset (no .env), the local demo defaults admin123 / guard123 apply. Set both in .env for anything public.
aerovisit.security.guard-password=${AEROVISIT_GUARD_PASSWORD:guard123}
aerovisit.security.director-password=${AEROVISIT_DIRECTOR_PASSWORD:admin123}

# --- 4c. AI microservice (AeroVisit-AI, FastAPI) and OCR engine ---
aerovisit.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
# Shared secret sent as X-Internal-Key on every call to the AI service; set the SAME AI_INTERNAL_KEY on both Railway
# services. Blank (local dev) = no header sent, and the AI service then skips the check too.
aerovisit.ai.internal-key=${AI_INTERNAL_KEY:}
aerovisit.ocr.tessdata-path=${TESSDATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}

# --- 5. Booking-form spam protection ---
# Email OTP (OtpService): a 6-digit code mailed through the Gmail account in section 3, valid 5 minutes.
# (Replaced Google reCAPTCHA.)

# --- 6. Public address of this site (used for links in emails, e.g. the feedback link) ---
# Set PUBLIC_BASE_URL to your ngrok or domain address, e.g. https://your-name.ngrok-free.dev
aerovisit.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

# --- 7. Website Content (Exhibits slideshow photos) ---
# Photos are saved here and served publicly at /exhibit-photos/**
aerovisit.exhibits.dir=uploads/exhibits
# Upload limits (Spring's default is 1MB per file). Applies to every upload form, including the visitor ID photo
# (phone camera photos are often over 5MB). Exhibit photos keep their own 5MB per-photo check (ExhibitPhotoStorage).
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
# Tomcat stops reading an over-limit upload after 2MB by default and drops the connection, so the browser shows
# "connection reset" instead of the "photo too large" message. Reading up to 50MB lets that message arrive.
server.tomcat.max-swallow-size=50MB

# --- 7b. Error pages ---
# Never send Java internals to the browser, even when spring-boot-devtools (which turns these on) is running.
# Visitors get templates/error.html or templates/error/404.html instead.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- 7c. System alert inbox ---
# Where the Director's daily report and critical-feedback alerts go. Set ALERT_EMAIL to the museum's inbox;
# by default it is the system's own sending address (PAFMuseumOfficial@gmail.com).
aerovisit.alerts.email=${ALERT_EMAIL:${aerovisit.mail.from:}}

# --- 2. Hibernate / JPA Settings (The Magic) ---
# 🔒 SQL logs turned ON temporarily so we can see the tables generating in the console
spring.jpa.show-sql=true
# 🔥 FORCE CREATE MODE
spring.jpa.hibernate.ddl-auto=update